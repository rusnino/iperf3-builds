name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream iperf3 version/tag to build (e.g. 3.22)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  generate-linux-static-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate matrix from targets.json
        id: set
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open('targets.json'))
          matrix = {'include': []}
          for arch, meta in data['arch'].items():
              if not meta.get('stable', False):
                  continue
              matrix['include'].append({'arch': arch, 'auth': False})
              if meta.get('auth', True):
                  matrix['include'].append({'arch': arch, 'auth': True})
          print(json.dumps(matrix))
          PY > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build-linux-static:
    needs: generate-linux-static-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-linux-static-matrix.outputs.matrix) }}
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "ERROR: version input is empty" >&2
            exit 1
          fi
          if [[ "$VERSION" == *[/\\]* || "$VERSION" == *..* ]] || ! [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "ERROR: invalid version input: $VERSION" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build static (${{ matrix.arch }}) binary
        env:
          IPERF_VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          AUTH: ${{ matrix.auth }}
        run: |
          set -euo pipefail
          ./scripts/build-static.sh

      - name: Upload static artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-${{ matrix.arch }}-static${{ matrix.auth && '-auth' || '' }}
          path: iperf3-*-linux-${{ matrix.arch }}-static${{ matrix.auth && '-auth' || '' }}.tar.gz
          if-no-files-found: error

  build-dynamic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        auth: [false, true]
    container:
      image: almalinux:8
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "ERROR: version input is empty" >&2
            exit 1
          fi
          if [[ "$VERSION" == *[/\\]* || "$VERSION" == *..* ]] || ! [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "ERROR: invalid version input: $VERSION" >&2
            exit 1
          fi

      - name: Install git
        run: yum install -y git

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build dynamic (glibc) binary
        env:
          IPERF_VERSION: ${{ inputs.version }}
          AUTH: ${{ matrix.auth }}
        run: |
          set -euo pipefail
          ./scripts/build-dynamic.sh

      - name: Upload dynamic artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-x86_64-dynamic${{ matrix.auth && '-auth' || '' }}
          path: iperf3-build-dynamic${{ matrix.auth && '-auth' || '' }}/iperf3-*-linux-x86_64-dynamic${{ matrix.auth && '-auth' || '' }}.tar.gz
          if-no-files-found: error

  build-macos-x86_64:
    runs-on: macos-26-intel
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        auth: [false, true]
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "ERROR: version input is empty" >&2
            exit 1
          fi
          if [[ "$VERSION" == *[/\\]* || "$VERSION" == *..* ]] || ! [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "ERROR: invalid version input: $VERSION" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build macOS x86_64 binary
        env:
          IPERF_VERSION: ${{ inputs.version }}
          ARCH: x86_64
          AUTH: ${{ matrix.auth }}
        run: ./scripts/build-macos-arch.sh

      - name: Upload x86_64 binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-macos-x86_64${{ matrix.auth && '-auth' || '' }}
          path: macos-build-x86_64${{ matrix.auth && '-auth' || '' }}/*
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        auth: [false, true]
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "ERROR: version input is empty" >&2
            exit 1
          fi
          if [[ "$VERSION" == *[/\\]* || "$VERSION" == *..* ]] || ! [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "ERROR: invalid version input: $VERSION" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build macOS arm64 binary
        env:
          IPERF_VERSION: ${{ inputs.version }}
          ARCH: arm64
          AUTH: ${{ matrix.auth }}
        run: ./scripts/build-macos-arch.sh

      - name: Upload arm64 binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-macos-arm64${{ matrix.auth && '-auth' || '' }}
          path: macos-build-arm64${{ matrix.auth && '-auth' || '' }}/*
          if-no-files-found: error

  package-macos-universal:
    needs: [build-macos-x86_64, build-macos-arm64]
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        auth: [false, true]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download macOS x86_64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-macos-x86_64${{ matrix.auth && '-auth' || '' }}
          path: macos-build-x86_64${{ matrix.auth && '-auth' || '' }}

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-macos-arm64${{ matrix.auth && '-auth' || '' }}
          path: macos-build-arm64${{ matrix.auth && '-auth' || '' }}

      - name: Package universal2 binary
        env:
          IPERF_VERSION: ${{ inputs.version }}
          AUTH: ${{ matrix.auth }}
        run: ./scripts/build-macos-universal.sh

      - name: Upload universal2 artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-universal2${{ matrix.auth && '-auth' || '' }}
          path: iperf3-*-macos-universal2${{ matrix.auth && '-auth' || '' }}.tar.gz
          if-no-files-found: error

  release:
    needs:
      - build-linux-static
      - build-dynamic
      - build-macos-x86_64
      - build-macos-arm64
      - package-macos-universal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          UPSTREAM: esnet/iperf
        run: |
          set -euo pipefail

          # Fetch upstream release metadata.
          release_json=$(gh api "repos/${UPSTREAM}/releases/tags/${VERSION}")
          release_body=$(echo "$release_json" | jq -r '.body // ""')
          is_prerelease=$(echo "$release_json" | jq -r '.prerelease // false')

          # Write release notes to a file to avoid shell quoting issues.
          printf '%s' "$release_body" > release-notes.md

          prerelease_flag=""
          if [ "$is_prerelease" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          # Determine whether this is the current upstream stable release.
          latest_upstream=""
          is_latest=false
          if [ "$is_prerelease" != "true" ]; then
            latest_upstream=$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name')
            if [ "$VERSION" = "$latest_upstream" ]; then
              is_latest=true
            fi
          fi

          cd artifacts
          if ! ls iperf3-*.tar.gz >/dev/null 2>&1; then
            echo "ERROR: no release archives found" >&2
            exit 1
          fi

          # Generate checksums.
          sha256sum iperf3-*.tar.gz > SHA256SUMS

          release_exists=false
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "$release_exists" = "true" ]; then
            echo "Release ${VERSION} already exists; uploading/overwriting assets."
            gh release upload "${VERSION}" iperf3-*.tar.gz SHA256SUMS --clobber
            gh release edit "${VERSION}" --notes-file ../release-notes.md ${prerelease_flag}
            if [ "$is_latest" = "true" ]; then
              gh release edit "${VERSION}" --latest
            fi
          else
            latest_flag="--latest=false"
            if [ "$is_latest" = "true" ]; then
              latest_flag="--latest=true"
            fi
            echo "Creating release ${VERSION} (prerelease=${is_prerelease}, latest=${latest_flag:-no})..."
            gh release create "${VERSION}" \
              --title "iperf3 ${VERSION} builds" \
              --notes-file ../release-notes.md \
              ${prerelease_flag} \
              ${latest_flag} \
              iperf3-*.tar.gz SHA256SUMS
          fi

  retry-failed-jobs:
    needs:
      - build-linux-static
      - build-dynamic
      - build-macos-x86_64
      - build-macos-arm64
      - package-macos-universal
      - release
    runs-on: ubuntu-latest
    if: failure() && github.run_attempt < 3
    permissions:
      actions: write
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Rerunning failed jobs for run ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
          gh run rerun ${{ github.run_id }} --failed --repo ${{ github.repository }}
